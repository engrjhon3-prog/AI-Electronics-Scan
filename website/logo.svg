<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123B3F"/>
      <stop offset="1" stop-color="#0A1D20"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FD8C0"/>
      <stop offset="1" stop-color="#0FA18D"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Faint circuit traces -->
  <g stroke="#1FD8C0" stroke-width="10" opacity="0.18" fill="none" stroke-linecap="round">
    <path d="M 90 300 H 200 V 210 H 300"/>
    <path d="M 934 724 H 824 V 814 H 724"/>
    <path d="M 140 760 H 230 V 860"/>
    <path d="M 884 260 H 794 V 160"/>
  </g>
  <g fill="#1FD8C0" opacity="0.28">
    <circle cx="300" cy="210" r="14"/>
    <circle cx="724" cy="814" r="14"/>
    <circle cx="230" cy="860" r="14"/>
    <circle cx="794" cy="160" r="14"/>
  </g>

  <!-- Scan brackets -->
  <g stroke="#FFB300" stroke-width="38" fill="none" stroke-linecap="round">
    <path d="M 170 306 V 216 Q 170 170 216 170 H 306"/>
    <path d="M 718 170 H 808 Q 854 170 854 216 V 306"/>
    <path d="M 854 718 V 808 Q 854 854 808 854 H 718"/>
    <path d="M 306 854 H 216 Q 170 854 170 808 V 718"/>
  </g>

  <!-- IC chip -->
  <g>
    <!-- pins -->
    <g fill="#B8FFF4">
      <!-- left -->
      <rect x="256" y="392" width="66" height="40" rx="20"/>
      <rect x="256" y="492" width="66" height="40" rx="20"/>
      <rect x="256" y="592" width="66" height="40" rx="20"/>
      <!-- right -->
      <rect x="702" y="392" width="66" height="40" rx="20"/>
      <rect x="702" y="492" width="66" height="40" rx="20"/>
      <rect x="702" y="592" width="66" height="40" rx="20"/>
      <!-- top -->
      <rect x="392" y="256" width="40" height="66" rx="20"/>
      <rect x="492" y="256" width="40" height="66" rx="20"/>
      <rect x="592" y="256" width="40" height="66" rx="20"/>
      <!-- bottom -->
      <rect x="392" y="702" width="40" height="66" rx="20"/>
      <rect x="492" y="702" width="40" height="66" rx="20"/>
      <rect x="592" y="702" width="40" height="66" rx="20"/>
    </g>
    <!-- body -->
    <rect x="312" y="312" width="400" height="400" rx="64" fill="url(#chip)"/>
    <rect x="352" y="352" width="320" height="320" rx="44" fill="none"
          stroke="#073430" stroke-opacity="0.35" stroke-width="14"/>
    <!-- lens eye -->
    <circle cx="512" cy="512" r="118" fill="#0A2A28"/>
    <circle cx="512" cy="512" r="86" fill="#EAFFFB"/>
    <circle cx="512" cy="512" r="46" fill="#0FA18D"/>
    <circle cx="543" cy="481" r="18" fill="#EAFFFB"/>
    <!-- pin-1 dot -->
    <circle cx="376" cy="376" r="16" fill="#073430" opacity="0.45"/>
  </g>
</svg>
