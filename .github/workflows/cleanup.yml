name: Cleanup Expired Uploads

on:
  schedule:
    # Every 6 hours — free-tier uploads expire after 12h, Pro after 7 days.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install firebase-admin
        run: pip install --quiet firebase-admin
      - name: Delete expired uploads
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python backend/scripts/cleanup_expired_uploads.py
