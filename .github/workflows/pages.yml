name: Deploy Website

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish website/ to the gh-pages branch. GitHub auto-enables Pages
      # for a branch named gh-pages, so no manual setup is needed.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website
          publish_branch: gh-pages
